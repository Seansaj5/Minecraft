# Pings every server in site/servers.json every 10 minutes and stores the
# results on the `status-data` branch, which the website reads for uptime,
# ping and player history. Opens an issue labelled `server-down` when a
# server stops responding and closes it when the server is back.
name: Monitor servers

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths: ["site/servers.json", "scripts/monitor.mjs", ".github/workflows/monitor.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Load previous history
        run: |
          mkdir -p status
          if git fetch --depth=1 origin status-data; then
            git show FETCH_HEAD:history.json > status/history.json
          else
            echo "No history yet - starting fresh."
          fi

      - name: Check servers
        run: node scripts/monitor.mjs site/servers.json status/history.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The branch is rewritten as a single commit each run so it never grows.
      - name: Save history to status-data branch
        working-directory: status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b status-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -q -m "Server status $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-data
